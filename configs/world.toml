# Garlemald world-server configuration (localhost defaults).

[server]
bind_ip = "127.0.0.1"
port = 54992
show_timestamp = true
# Entry id in the server list (`configs/servers.toml`) — it ships with
# id=1 "Fernehalwes" so this matches out of the box.
world_id = 1

[database]
path = "./data/garlemald.db"

[servers]
# World list shared with lobby-server; resolves this world's display name.
path = "./configs/servers.toml"
