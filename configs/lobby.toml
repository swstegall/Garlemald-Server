# Garlemald lobby-server configuration (localhost defaults).
# Loaded by `./lobby-server --config ./configs/lobby.toml`.

[server]
bind_ip = "127.0.0.1"
port = 54994
show_timestamp = true

[database]
# Shared SQLite file used by all three servers. Created (with schema) on
# first run if missing.
path = "./data/garlemald.db"

[servers]
# World list shown at character select. Edit configs/servers.toml to
# rename a world or change its advertised address/port — no DB edits.
path = "./configs/servers.toml"
